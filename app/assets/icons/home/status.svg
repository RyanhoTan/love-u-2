<svg width="49" height="49" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 今日状态图标：模拟 image_4a1cd0.png 中的柔和微渐变风格 -->
  <defs>
    <!-- 定义主体渐变色：暖黄色渐变 -->
    <linearGradient id="statusGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD966;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <!-- 阴影滤镜：增加立体感 -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#F59E0B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 圆润的背景底色 -->
  <circle cx="50" cy="50" r="40" fill="url(#statusGradient)" filter="url(#softShadow)"/>
  
  <!-- 表情元素：模拟那种可爱的面部特征 -->
  <!-- 左眼 -->
  <circle cx="40" cy="45" r="4" fill="#6B4226"/>
  <!-- 右眼 -->
  <circle cx="60" cy="45" r="4" fill="#6B4226"/>
  <!-- 羞红：增加恋爱 App 的甜美感 -->
  <circle cx="32" cy="55" r="5" fill="#FFFFFF" fill-opacity="0.4"/>
  <circle cx="68" cy="55" r="5" fill="#FFFFFF" fill-opacity="0.4"/>
  <!-- 嘴巴 -->
  <path d="M40 65 Q50 75 60 65" fill="none" stroke="#6B4226" stroke-width="4" stroke-linecap="round"/>
</svg>
